name: Environment tests

# Installs the toolchain with the Immutable installer, then runs init and add_auth (sqlite, -cache, -quick)
on:
  pull_request:
    branches: [beta]

jobs:
  init-and-auth:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Immutable
        run: npm ci && npm run build

      - name: Install toolchain
        run: node .build/start.js

      # mise and its shims for the steps that follow
      - name: Add mise shims to PATH
        run: |
          if [ -n "$LOCALAPPDATA" ]; then echo "$LOCALAPPDATA/mise/shims" >> "$GITHUB_PATH"; else
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          fi


      # Empty answer to the git domain prompt skips the remote
      - name: Init
        working-directory: ${{ runner.temp }}
        run: echo "" | node "$GITHUB_WORKSPACE/.build/init_proj.js" envtest -sqlite -cache -quick

      - name: Add auth
        working-directory: ${{ runner.temp }}/envtest_umbrella
        run: echo "" | node "$GITHUB_WORKSPACE/.build/add_auth.js" -quick

